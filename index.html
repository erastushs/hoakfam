<!DOCTYPE html><html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hoak Family</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1e1f22;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: white;
      overflow: hidden;
      cursor: url('cursor-gamepad.png'), auto;
    }
    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }
    .container {
      z-index: 1;
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      text-align: center;
    }
    .logo {
      width: 130px;
      border-radius: 12px;
      animation: glitch 1s infinite;
      cursor: pointer;
    }
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-1px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }
    h1 {
      font-size: 2.5rem;
      margin-top: 1rem;
      color: #5865F2;
      text-shadow: 0 0 15px #5865F2;
    }
    .typing {
      font-size: 1.2rem;
      color: #ccc;
      height: 1.5em;
      white-space: nowrap;
      overflow: hidden;
      border-right: .15em solid #5865F2;
      animation: blink .75s step-end infinite;
    }
    @keyframes blink {
      from, to { border-color: transparent }
      50% { border-color: #5865F2 }
    }
    ul {
      color: #ddd;
      font-size: 1rem;
      margin: 1.5rem 0;
      line-height: 1.8;
      padding-left: 0;
      list-style: none;
    }
    button {
      padding: 12px 30px;
      background-color: #5865F2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      animation: pulse 1.5s infinite;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px #5865F2;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88,101,242, 0.7); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(88,101,242, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(88,101,242, 0); }
    }
    .testimoni {
      font-style: italic;
      color: #aaa;
      margin-top: 1.5rem;
      max-width: 300px;
    }
    #easter-egg {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #easter-egg iframe {
      width: 80vw;
      height: 45vw;
      max-width: 800px;
      max-height: 450px;
      border: none;
      border-radius: 12px;
    }
    @media screen and (max-width: 480px) {
      h1 { font-size: 2rem; }
      .typing { font-size: 1rem; }
      button { width: 80%; }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <img src="logo.png" alt="Hoak Logo" class="logo" id="logo">
    <h1>Hoak Family</h1>
    <div class="typing" id="typewriter"></div><ul>
  <li title="Main bareng?">🎮 Mabar game apapun bareng kita</li>
  <li title="Gratisan alert">🎁 Info game gratis & info bonus in-game menarik</li>
  <li title="Bot lucu?">🤖 Banyak bot unik dan menghibur</li>
</ul>

<button onclick="window.location.href='https://discord.com/invite/Aukqfcd'">Join Sekarang</button>

<div class="testimoni">
  💬 "Server paling rame buat mabar malam-malam!"<br><strong>- Devan#007</strong>
</div>

  </div>  <div id="easter-egg">
    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&rel=0" allow="autoplay"></iframe>
  </div>  <audio id="bgMusic" autoplay loop>
    <source src="intro.mp3" type="audio/mpeg">
  </audio>  <script>
    // Redirect
    setTimeout(() => {
      document.body.innerHTML = '<div style="color:white;display:flex;align-items:center;justify-content:center;height:100vh;font-size:1.5rem">Redirecting...</div>';
      window.location.href = 'https://discord.com/invite/Aukqfcd';
    }, 30000);

    // Play music on click
    document.addEventListener('click', () => {
      const audio = document.getElementById('bgMusic');
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    });

    // Efek typing
    const text = "Bergabunglah dengan komunitas gamers yang aktif dan seru!";
    let i = 0;
    function typeWriter() {
      if (i < text.length) {
        document.getElementById("typewriter").textContent += text.charAt(i);
        i++;
        setTimeout(typeWriter, 40);
      }
    }
    typeWriter();

    // Partikel simbol
    const symbols = ["△", "□", "○", "×"];
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];
    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 24 + 16;
        this.speedX = Math.random() * 0.6 - 0.3;
        this.speedY = Math.random() * 0.6 - 0.3;
        this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
        this.alpha = Math.random() * 0.5 + 0.3;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
      }
      draw() {
        ctx.font = this.size + "px Arial";
        ctx.fillStyle = `rgba(88, 101, 242, ${this.alpha})`;
        ctx.fillText(this.symbol, this.x, this.y);
      }
    }

    function initParticles() {
      particlesArray = [];
      for (let i = 0; i < 70; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    });

    initParticles();
    animate();

    // Easter egg klik logo 7x
    let logoClickCount = 0;
    const logo = document.getElementById('logo');
    logo.addEventListener('click', () => {
      logoClickCount++;
      if (logoClickCount === 7) {
        document.getElementById('easter-egg').style.display = 'flex';
        logoClickCount = 0;
      }
    });
  </script></body>
</html>
