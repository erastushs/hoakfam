<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hoak Family</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png" type="image/png">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #1e1f22;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      color: white;
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      z-index: 1;
      position: relative;
      max-width: 600px;
      margin: auto;
      top: 50%;
      transform: translateY(-50%);
      text-align: center;
      padding: 2rem;
    }

    .logo {
      width: 160px;
      border-radius: 12px;
      animation: glitch 1s infinite;
    }

    .title {
      font-size: 2.5rem;
      margin-top: 1rem;
      color: #5865F2;
      position: relative;
      animation: glitchText 1s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(2px, -2px); }
      60% { transform: translate(-1px, 1px); }
      80% { transform: translate(1px, -1px); }
      100% { transform: translate(0); }
    }

    @keyframes glitchText {
      0% { text-shadow: 2px 0 red; }
      20% { text-shadow: -2px 0 cyan; }
      40% { text-shadow: 2px 2px lime; }
      60% { text-shadow: -1px -1px magenta; }
      80% { text-shadow: 1px 1px #5865F2; }
      100% { text-shadow: 0 0 10px #5865F2; }
    }

    p {
      color: #ccc;
      font-size: 1.2rem;
    }

    ul {
      text-align: left;
      display: inline-block;
      margin-top: 1.2rem;
      color: #ddd;
      font-size: 1.05rem;
      line-height: 1.8;
    }

    button {
      margin-top: 2rem;
      padding: 12px 30px;
      background-color: #5865F2;
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 1.1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #4752c4;
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>

  <div class="container">
    <img src="logo.png" alt="Hoak Logo" class="logo">
    <h1 class="title">Hoak Family</h1>
    <p>Bergabunglah dengan komunitas gamers yang aktif dan seru!</p>
    <ul>
      <li>🎮 Mabar game apapun bareng kita</li>
      <li>🎁 Info game gratis & info bonus in-game menarik</li>
      <li>🤖 Banyak bot unik dan menghibur</li>
    </ul>
    <button onclick="window.location.href='https://discord.com/invite/Aukqfcd'">Join Sekarang</button>
  </div>

  <audio id="bgMusic" autoplay loop>
    <source src="intro.mp3" type="audio/mpeg">
    Browser kamu tidak mendukung audio.
  </audio>

  <script>
    // Redirect setelah 10 detik
    setTimeout(() => {
      window.location.href = 'https://discord.com/invite/Aukqfcd';
    }, 10000);

    // Autoplay fix (khusus mobile)
    document.addEventListener('click', () => {
      const audio = document.getElementById('bgMusic');
      if (audio.paused) {
        audio.play().catch(() => {});
      }
    });

    // Particle background
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = '#5865F2';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      particlesArray = [];
      for (let i = 0; i < 100; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });

    init();
    animate();
  </script>
</body>
</html>
