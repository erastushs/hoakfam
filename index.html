<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hoak Family Discord</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0e0e0e;
      color: #f1f1f1;
    }

    canvas#particles {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 600px;
      margin: auto;
      padding: 2rem;
      text-align: center;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      border-radius: 16px;
      box-shadow: 0 0 30px rgba(0,255,200,0.1);
    }

    h1 {
      font-size: 2.8rem;
      color: #00ffc3;
      animation: glow 2s infinite alternate;
      margin-bottom: 1rem;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #00ffc3, 0 0 20px #00ffc3;
      }
      to {
        text-shadow: 0 0 20px #00ffc3, 0 0 40px #00ffc3;
      }
    }

    p {
      font-size: 1.1rem;
      color: #ccc;
      margin-bottom: 1.5rem;
    }

    ul {
      text-align: left;
      margin-bottom: 1.5rem;
    }

    ul li {
      margin: 0.5rem 0;
      font-size: 1rem;
    }

    .join-btn {
      background: #00ffc3;
      color: #000;
      padding: 0.8rem 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      display: inline-block;
      transition: background 0.3s ease;
    }

    .join-btn:hover {
      background: #00cfa6;
    }

    @media screen and (max-width: 600px) {
      .container {
        margin: 1rem;
        padding: 1.5rem;
      }
      h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <canvas id="particles"></canvas>
  <div class="container">
    <h1>Hoak Family Discord</h1>
    <p>Bergabunglah dengan komunitas gamers yang aktif dan seru!</p>
    <ul>
      <li>🎮 Mabar game apapun bareng komunitas</li>
      <li>🎁 Info game gratis & bonus in-game menarik</li>
      <li>🤖 Banyak bot unik dan menghibur</li>
    </ul>
    <a href="https://discord.com/invite/Aukqfcd" target="_blank" class="join-btn">Join Discord Sekarang</a>
  </div>

  <script>
    const canvas = document.getElementById('particles');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let particlesArray = [];

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 1;
        this.speedX = Math.random() * 1 - 0.5;
        this.speedY = Math.random() * 1 - 0.5;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;

        if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
        if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
      }

      draw() {
        ctx.fillStyle = '#00ffc3';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function init() {
      particlesArray = [];
      const numberOfParticles = 100;
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].update();
        particlesArray[i].draw();
      }
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    });

    init();
    animate();
  </script>
</body>
</html>
